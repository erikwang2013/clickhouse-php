name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
          else
            RANGE="HEAD"
          fi

          # 扫描上一个 tag 以来的所有提交，取最高升级级别。
          # 约定式前缀优先：docs: 新增… 仍算 patch，不会被中文“新增”误判成 minor。
          BUMP=patch
          while IFS= read -r SUBJECT; do
            case "$SUBJECT" in
              *BREAKING*|*破坏性*|*!:*|*!：*)
                BUMP=major
                break
                ;;
              feat*|feature*)
                if [ "$BUMP" = "patch" ]; then
                  BUMP=minor
                fi
                ;;
              fix*|docs*|chore*|ci*|test*|refactor*|perf*|build*|style*)
                :
                ;;
              *新增*|*特性*)
                if [ "$BUMP" = "patch" ]; then
                  BUMP=minor
                fi
                ;;
            esac
          done <<< "$(git log --pretty=%s "$RANGE")"

          if [ -z "$PREV" ]; then
            NEXT="v0.1.0"
          else
            MAJOR=$(echo "$PREV" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$PREV" | cut -d. -f2)
            PATCH=$(echo "$PREV" | cut -d. -f3)
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEXT="v$MAJOR.$MINOR.$PATCH"
          fi

          echo "prev=$PREV  bump=$BUMP  next=$NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        env:
          NEXT: ${{ steps.version.outputs.next }}
          PREV: ${{ steps.version.outputs.prev }}
        run: |
          if [ -n "$PREV" ]; then
            git log --pretty=format:"- %s" "$PREV..HEAD" > /tmp/changelog.md
          else
            git log --pretty=format:"- %s" > /tmp/changelog.md
          fi

          # 项目宠物：release 页面底部展示 docs/pet.svg
          printf '\n\n---\n\n![clickhouse-php](https://raw.githubusercontent.com/%s/main/docs/pet.svg)\n' \
            "${{ github.repository }}" >> /tmp/changelog.md

      - name: Create and push tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "$NEXT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh release create "$NEXT" --title "$NEXT" --notes-file /tmp/changelog.md
