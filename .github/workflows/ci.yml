name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.0, 8.1, 8.2, 8.3, 8.4, 8.5]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        if: ${{ matrix.php != '8.0' }}
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        if: ${{ matrix.php != '8.0' }}
        run: vendor/bin/phpunit --no-coverage

      # phpunit.xml is PHPUnit-10 format, which phpunit 9.6 (the version
      # composer resolves on PHP 8.0) cannot parse, so 8.0 gets syntax and
      # smoke checks instead of the full suite.
      # --ignore-platform-req=php: composer.json currently declares php >=8.1;
      # harmless no-op once the constraint is relaxed to >=8.0.
      - name: Install runtime dependencies (PHP 8.0)
        if: ${{ matrix.php == '8.0' }}
        run: composer install --no-interaction --prefer-dist --no-dev --ignore-platform-req=php

      - name: Syntax check (PHP 8.0)
        if: ${{ matrix.php == '8.0' }}
        run: find src -name '*.php' -exec php -l {} \;

      - name: Smoke test (PHP 8.0)
        if: ${{ matrix.php == '8.0' }}
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';

          use Erikwang2013\ClickHouse\Client\ClientInterface;
          use Erikwang2013\ClickHouse\Client\Manager;
          use Erikwang2013\ClickHouse\Pool\NoPool;
          use Erikwang2013\ClickHouse\Query\Builder as QueryBuilder;
          use Erikwang2013\ClickHouse\Query\Result;
          use Erikwang2013\ClickHouse\Schema\Builder as SchemaBuilder;
          use Erikwang2013\ClickHouse\Support\Config;
          use Erikwang2013\ClickHouse\Support\Pet;

          $client = new class implements ClientInterface {
              public function query(string $sql, array $bindings = []): Result
              {
                  return new Result([]);
              }

              public function select(string $sql, array $bindings = []): array
              {
                  return [];
              }

              public function insert(string $table, array $data): int
              {
                  return 1;
              }

              public function ping(): bool
              {
                  return true;
              }
          };

          new Config(['host' => 'localhost', 'port' => 8123]);
          new QueryBuilder($client);
          new SchemaBuilder($client);
          new NoPool(static fn () => $client);
          new Result([['id' => 1]]);

          // 原生 PHP 入口与命令行横幅使用的 API
          Manager::fromEnv();
          Pet::lines();

          echo "OK\n";
          PHP

  # The unit suite stubs the transport, so it cannot see anything the server
  # rejects. That is how "every statement gets ` FORMAT JSON` appended, so every
  # INSERT fails on a real server" stayed invisible for so long — see
  # tests/Integration/InsertTest.php. This job runs the same client against a
  # real ClickHouse.
  integration:
    name: Integration (real ClickHouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The service container takes CLICKHOUSE_PASSWORD for its own user setup;
    # the PHP client reads CLICKHOUSE_PASS (see Manager::fromEnv). The anchor
    # keeps both sides on one explicitly set value instead of relying on the
    # image's empty default password.
    env:
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASS: &clickhouse_password clickhouse-ci-password
      # A misconfigured service container must not produce "0 integration tests
      # run, all green" — that is the failure mode this suite exists to catch.
      CLICKHOUSE_INTEGRATION_REQUIRED: '1'

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: *clickhouse_password
        ports:
          - 8123:8123
        # /ping answers without credentials, so the health check needs no auth
        # (the image ships wget, not curl).
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # The service health check only proves the port answers (/ping needs no
      # credentials). This proves the exact user/password pair the tests will
      # use actually authenticates, using the same headers HttpTransport sends,
      # and fails before PHPUnit with the server's own message on mismatch.
      - name: Wait for ClickHouse to accept our credentials
        run: |
          url="http://$CLICKHOUSE_HOST:$CLICKHOUSE_PORT/"
          for attempt in $(seq 1 60); do
            body=$(curl -sS -m 5 \
              -H "X-ClickHouse-User: $CLICKHOUSE_USER" \
              -H "X-ClickHouse-Key: $CLICKHOUSE_PASS" \
              --data-binary "SELECT 1" "$url" 2>&1) && [ "$body" = "1" ] && {
              echo "ClickHouse authenticated user '$CLICKHOUSE_USER' and answered SELECT 1"
              exit 0
            }
            echo "attempt $attempt: $body"
            sleep 2
          done
          echo "ClickHouse did not accept the configured credentials in time" >&2
          exit 1

      - name: Run integration tests
        run: vendor/bin/phpunit --group integration
