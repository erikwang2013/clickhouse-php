<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" aria-labelledby="lifeTitle lifeDesc">
  <title id="lifeTitle">clickhouse-php Lebenszyklus</title>
  <desc id="lifeDesc">Lebenszyklus einer Abfrage in neun Schritten: Initialisierung, Client holen, Aufbau, Kompilierung, Pool-Verbindung holen, Senden, Auswertung, Nutzung, Rückgabe; rechts die möglichen Ausnahmen je Phase; unten der Migrationslebenszyklus.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1E2233}
    .ttl{font-size:20px;font-weight:700}
    .sub{font-size:12px;fill:#5A6172}
    .ctr{text-anchor:middle}
    .sec{font-size:14px;font-weight:700}
    .st{font-size:12.5px;font-weight:700}
    .sd{font-size:11px;fill:#5A6172}
    .num{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}
    .et{font-size:11.5px;font-weight:700}
    .ed{font-size:10.5px;fill:#5A6172}
    .ebx{fill:#FFF1F0;stroke:#E05252;stroke-width:1.8}
    .mt{font-size:12px;font-weight:700}
    .md{font-size:10px;fill:#5A6172}
    .bx{fill:#fff;stroke:#1E2233;stroke-width:2}
    .mbx{fill:#FFF6D0;stroke:#1E2233;stroke-width:2}
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#1E2233"/>
    </marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#E05252"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="860" fill="#FFFFFF"/>
  <text class="ttl ctr" x="450" y="44">clickhouse-php Lebenszyklus</text>
  <text class="sub ctr" x="450" y="66">Links die vollständige Abfragekette, rechts mögliche Ausnahmen je Phase, unten der Migrationslebenszyklus</text>

  <text class="sec" x="40" y="102">① Abfrage-Lebenszyklus</text>
  <text class="sec" x="620" y="102">Ausnahmen</text>

  <!-- Hauptstrang -->
  <line x1="78" y1="140" x2="78" y2="588" stroke="#D5D8E3" stroke-width="3"/>
  <line x1="78" y1="140" x2="78" y2="588" stroke="#777BB4" stroke-width="3"/>

  <circle cx="78" cy="140" r="14" fill="#777BB4"/><text class="num" x="78" y="145">1</text>
  <text class="st" x="106" y="136">Initialisierung</text>
  <text class="sd" x="106" y="154">ClickHouse::setManager($manager); Framework-Adapter als Container-Singleton</text>

  <circle cx="78" cy="196" r="14" fill="#777BB4"/><text class="num" x="78" y="201">2</text>
  <text class="st" x="106" y="192">Client beziehen</text>
  <text class="sd" x="106" y="210">Manager::connection($name): Pool-Treffer → PooledClient, sonst HttpClient + Cache</text>

  <circle cx="78" cy="252" r="14" fill="#777BB4"/><text class="num" x="78" y="257">3</text>
  <text class="st" x="106" y="248">Abfrage bauen</text>
  <text class="sd" x="106" y="266">ClickHouse::table('logs')-&gt;where(...)-&gt;limit(100), Bedingungen sammeln sich in der Kette</text>

  <circle cx="78" cy="308" r="14" fill="#777BB4"/><text class="num" x="78" y="313">4</text>
  <text class="st" x="106" y="304">SQL kompilieren</text>
  <text class="sd" x="106" y="322">Grammar::compileSelect() erzeugt SELECT … FROM `db`.`logs` WHERE … ORDER BY … LIMIT</text>

  <circle cx="78" cy="364" r="14" fill="#777BB4"/><text class="num" x="78" y="369">5</text>
  <text class="st" x="106" y="360">Pool-Verbindung</text>
  <text class="sd" x="106" y="378">PooledClient::withClient() → pool-&gt;get(): Idle-Reuse / neu bis max</text>

  <circle cx="78" cy="420" r="14" fill="#777BB4"/><text class="num" x="78" y="425">6</text>
  <text class="st" x="106" y="416">Binden &amp; Senden</text>
  <text class="sd" x="106" y="434">HttpTransport::send(): ?-Platzhalter ersetzen, POST-Body SQL + FORMAT JSON</text>

  <circle cx="78" cy="476" r="14" fill="#777BB4"/><text class="num" x="78" y="481">7</text>
  <text class="st" x="106" y="472">Antwort parsen</text>
  <text class="sd" x="106" y="490">HTTP 200 → json_decode → Result(rows, meta); sonst → QueryException</text>

  <circle cx="78" cy="532" r="14" fill="#777BB4"/><text class="num" x="78" y="537">8</text>
  <text class="st" x="106" y="528">Ergebnis nutzen</text>
  <text class="sd" x="106" y="546">Result::first() · toArray() · Iteration, Resultset readonly</text>

  <circle cx="78" cy="588" r="14" fill="#1E2233"/><text class="num" x="78" y="593">9</text>
  <text class="st" x="106" y="584">Verbindung zurück</text>
  <text class="sd" x="106" y="602">finally { pool-&gt;put($client) }: Rückgabe auf Erfolgs- und Fehlerpfad</text>

  <!-- Ausnahmespalte -->
  <rect class="ebx" x="620" y="168" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="188">Schritt 2 · keine Verbindung</text>
  <text class="ed" x="634" y="206">ConnectionException</text>

  <rect class="ebx" x="620" y="336" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="356">Schritt 5 · Pool erschöpft</text>
  <text class="ed" x="634" y="374">PoolException (active ≥ max)</text>

  <rect class="ebx" x="620" y="392" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="412">Schritt 6 · Netzwerkfehler</text>
  <text class="ed" x="634" y="430">ConnectionException / TimeoutException</text>

  <rect class="ebx" x="620" y="448" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="468">Schritt 7 · SQL-Fehler</text>
  <text class="ed" x="634" y="486">QueryException (getSql verfügbar)</text>

  <text class="sd" x="620" y="530">Basisklasse: ClickHouseException,</text>
  <text class="sd" x="620" y="548">Subklassen für Retry/Backoff fangen.</text>
  <text class="sd" x="620" y="578">ping() prüft vorab die Verbindung, damit</text>
  <text class="sd" x="620" y="596">Fehler nicht im Query-Pfad landen.</text>

  <!-- Migrationslebenszyklus -->
  <text class="sec" x="40" y="654">② Migrationslebenszyklus</text>
  <line x1="40" y1="668" x2="860" y2="668" stroke="#E2E4EC" stroke-width="1.5"/>

  <rect class="mbx" x="40" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="110" y="714">install()</text>
  <text class="md ctr" x="110" y="733">Tabelle anlegen</text>

  <rect class="mbx" x="210" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="280" y="714">run()</text>
  <text class="md ctr" x="280" y="733">Filtert · Batch+1</text>

  <rect class="mbx" x="380" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="450" y="714">up()</text>
  <text class="md ctr" x="450" y="733">Führt aus + Eintrag</text>

  <rect class="mbx" x="550" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="620" y="714">rollback()</text>
  <text class="md ctr" x="620" y="733">Letzter Batch rückwärts</text>

  <rect class="mbx" x="720" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="790" y="714">refresh()</text>
  <text class="md ctr" x="790" y="733">Mutation abwarten, neu</text>

  <line x1="182" y1="721" x2="204" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="352" y1="721" x2="374" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="522" y1="721" x2="544" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="692" y1="721" x2="714" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>

  <text class="sd" x="40" y="782">Bei Fehlern wird QueryException geworfen, mit Batch und Liste der ausgeführten Schritte.</text>
  <text class="sd" x="40" y="802">Das Rollback von refresh() nutzt die asynchrone ALTER TABLE … DELETE mutation; erst nach deren Abschluss ist run() erneut möglich.</text>
  <text class="sd" x="40" y="822">Migrationsdateien laufen nach Dateiname sortiert; der Klassenname wird daraus abgeleitet (Zeitstempel-Präfix entfernen, CamelCase).</text>
</svg>
