<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="featTitle featDesc">
  <title id="featTitle">clickhouse-php Funktionsdesign</title>
  <desc id="featDesc">Sechs Funktionsmodule: Query Builder, Schema Builder, Migrationssystem, ORM, mehrere Verbindungen und Verbindungspool, Framework-Integration, dazu Sicherheit und Ausnahmeklassen.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1E2233}
    .ttl{font-size:20px;font-weight:700}
    .sub{font-size:12px;fill:#5A6172}
    .ctr{text-anchor:middle}
    .card{fill:#fff;stroke:#1E2233;stroke-width:2}
    .ct{font-size:14px;font-weight:700}
    .cs{font-size:10px;fill:#8A90A6}
    .li{font-size:11.5px;fill:#333A4D}
    .hr{stroke:#E2E4EC;stroke-width:1.5}
    .bar{fill:#F2F3F5;stroke:#1E2233;stroke-width:2}
    .bt{font-size:13.5px;font-weight:700}
    .bl{font-size:11.5px;fill:#333A4D}
  </style>

  <rect x="0" y="0" width="900" height="780" fill="#FFFFFF"/>
  <text class="ttl ctr" x="450" y="44">clickhouse-php Funktionsdesign</text>
  <text class="sub ctr" x="450" y="66">Sechs Funktionsmodule, alle bereits implementiert</text>

  <!-- Karte 1: Query Builder -->
  <rect class="card" x="40" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="58" y="126">Query-Builder</text>
  <text class="cs ctr" x="250" y="126">Query\Builder</text>
  <rect x="58" y="136" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="40" y1="150" x2="300" y2="150"/>
  <g>
    <circle cx="64" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="76" y="175">Fluent API, kein IO beim Aufbau</text>
    <circle cx="64" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="76" y="196">where / orWhere / whereIn / whereNotIn</text>
    <circle cx="64" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="76" y="217">whereBetween / whereNull / whereRaw</text>
    <circle cx="64" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="76" y="238">orderBy / groupBy / limit / offset</text>
    <circle cx="64" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="76" y="259">Aggregate count/sum/avg/min/max</text>
    <circle cx="64" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="76" y="280">insert einzeln + Batch (1000er)</text>
    <circle cx="64" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="76" y="301">delete → ALTER TABLE … DELETE</text>
    <circle cx="64" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="76" y="322">toSql() liefert kompiliertes SQL</text>
  </g>

  <!-- Karte 2: Schema Builder -->
  <rect class="card" x="320" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="338" y="126">Schema Builder</text>
  <text class="cs ctr" x="530" y="126">Schema\Builder</text>
  <rect x="338" y="136" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="320" y1="150" x2="580" y2="150"/>
  <g>
    <circle cx="344" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="356" y="175">create / alter / drop für Tabellen</text>
    <circle cx="344" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="356" y="196">hasTable / getTables / getTableInfo</text>
    <circle cx="344" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="356" y="217">alle 21 ClickHouse-Spaltentypen</text>
    <circle cx="344" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="356" y="238">Zahlen Int8-64/UInt8-64/Float32-64</text>
    <circle cx="344" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="356" y="259">Decimal(P,S) · Date / DateTime64</text>
    <circle cx="344" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="356" y="280">Array / Nullable / LowCardinality</text>
    <circle cx="344" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="356" y="301">UUID / Bool / FixedString(N)</text>
    <circle cx="344" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="356" y="322">Engine: partitionBy / orderBy / ttl</text>
  </g>

  <!-- Karte 3: Migrationen -->
  <rect class="card" x="600" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="618" y="126">Migrationen</text>
  <text class="cs ctr" x="810" y="126">Migration</text>
  <rect x="618" y="136" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="600" y1="150" x2="860" y2="150"/>
  <g>
    <circle cx="624" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="636" y="175">install() erstellt die Tabelle</text>
    <circle cx="624" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="636" y="196">run() filtert bereits Gelaufenes</text>
    <circle cx="624" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="636" y="217">Batch+1, dann up() je Migration</text>
    <circle cx="624" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="636" y="238">rollback(steps) rückwärts je Batch</text>
    <circle cx="624" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="636" y="259">refresh(): Rollback → warten → neu</text>
    <circle cx="624" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="636" y="280">Fehler: QueryException + Kontext</text>
    <circle cx="624" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="636" y="301">MergeTree ORDER BY migration</text>
    <circle cx="624" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="636" y="322">Migration nutzt Schema Builder</text>
  </g>

  <!-- Karte 4: ORM -->
  <rect class="card" x="40" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="58" y="398">ORM</text>
  <text class="cs ctr" x="250" y="398">ORM\Model</text>
  <rect x="58" y="408" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="40" y1="422" x2="300" y2="422"/>
  <g>
    <circle cx="64" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="76" y="447">Vererbung von Model = ActiveRecord</text>
    <circle cx="64" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="76" y="468">Statisch: where/find/all/insert</text>
    <circle cx="64" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="76" y="489">__callStatic delegiert an Builder</text>
    <circle cx="64" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="76" y="510">save() schreibt attributes zurück</text>
    <circle cx="64" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="76" y="531">__get / __set ohne Felddeklaration</text>
    <circle cx="64" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="76" y="552">Collection map / filter / pluck</text>
    <circle cx="64" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="76" y="573">first / last / count / Indexzugriff</text>
    <circle cx="64" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="76" y="594">Schreiben wirft LogicException</text>
  </g>

  <!-- Karte 5: Verbindungen und Pool -->
  <rect class="card" x="320" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="338" y="398">Verbindungen &amp; Pool</text>
  <text class="cs ctr" x="530" y="398">Manager · Pool</text>
  <rect x="338" y="408" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="320" y1="422" x2="580" y2="422"/>
  <g>
    <circle cx="344" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="356" y="447">Manager: Verbindungen per Name</text>
    <circle cx="344" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="356" y="468">Lazy Loading + Instanz-Cache</text>
    <circle cx="344" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="356" y="489">Swoole / Swow / Workerman Coroutinen</text>
    <circle cx="344" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="356" y="510">NoPool: klassischer FPM-Modus</text>
    <circle cx="344" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="356" y="531">min / max_connections + Timeouts</text>
    <circle cx="344" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="356" y="552">Idle-Reuse → neu bis max → Fehler</text>
    <circle cx="344" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="356" y="573">PooledClient: finally gibt zurück</text>
    <circle cx="344" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="356" y="594">ping() Check · stats() Poolstatus</text>
  </g>

  <!-- Karte 6: Framework-Integration -->
  <rect class="card" x="600" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="618" y="398">Framework-Support</text>
  <text class="cs ctr" x="810" y="398">Vier Adapter</text>
  <rect x="618" y="408" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="600" y1="422" x2="860" y2="422"/>
  <g>
    <circle cx="624" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="636" y="447">Laravel Auto-Discovery + Commands</text>
    <circle cx="624" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="636" y="468">ThinkPHP Service + think-Befehle</text>
    <circle cx="624" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="636" y="489">Webman lädt Plugin-Config selbst</text>
    <circle cx="624" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="636" y="510">Hyperf ConfigProvider + Coroutinen</text>
    <circle cx="624" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="636" y="531">Einheitliche connections / pool</text>
    <circle cx="624" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="636" y="552">CLICKHOUSE_* ersetzt Defaults</text>
    <circle cx="624" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="636" y="573">Optionales PSR-3 Query-Log</text>
    <circle cx="624" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="636" y="594">CLI: Tabellenliste / Migrationen</text>
  </g>

  <!-- Sicherheit und Ausnahmen -->
  <rect class="bar" x="40" y="640" width="820" height="80" rx="14"/>
  <text class="bt" x="64" y="672">Sicherheit</text>
  <text class="bl" x="64" y="696">? Platzhalter-Bindung + Quoter-Escaping</text>
  <text class="bl" x="64" y="712">DB-/Tabellen-/Spaltennamen in Backticks</text>
  <line x1="470" y1="656" x2="470" y2="704" stroke="#C9CCD8" stroke-width="1.5"/>
  <text class="bt" x="500" y="672">Exception-Hierarchie</text>
  <text class="bl" x="500" y="696">ClickHouseException als Basis, vier Subklassen</text>
  <text class="bl" x="500" y="712">Connection (inkl. Timeout) · Query (getSql) · Pool</text>

  <text class="sub ctr" x="450" y="754">Alle genannten Funktionen sind vorhanden; JOIN / HAVING und Native TCP sind geplant</text>
</svg>
