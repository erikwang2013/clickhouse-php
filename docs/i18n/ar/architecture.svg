  <text class="n ctr" x="565" y="367">⁦PooledClient ⁩· وضع الحوض</text>
  <line class="dash" x1="418" y1="330" x2="464" y2="318" marker-end="url(#arwg)"/>
  <line class="dash" x1="418" y1="350" x2="464" y2="362" marker-end="url(#arwg)"/>
  <rect class="bx" x="688" y="306" width="156" height="68" rx="10"/>
  <text class="d ctr" x="766" y="332">تطبيق مشترك</text>
  <text class="n ctr" x="766" y="352">ClientInterface</text>

  <line class="link" x1="450" y1="386" x2="450" y2="402" marker-end="url(#arw)"/>

  <!-- L4 طبقة الحوض -->
  <rect class="band" x="40" y="406" width="820" height="88" rx="14" fill="#EDEEF8"/>
  <rect class="bar" x="56" y="432" width="5" height="36" rx="2.5" fill="#777BB4"/>
  <text class="lt" x="72" y="448">طبقة الحوض</text>
  <text class="ls" x="72" y="466">Pool</text>
  <rect class="bx" x="216" y="424" width="140" height="52" rx="10"/>
  <text class="n ctr" x="286" y="455">PoolInterface</text>
  <rect class="bx" x="386" y="424" width="250" height="52" rx="10"/>
  <text class="n ctr" x="511" y="447">AbstractPool</text>
  <text class="d ctr" x="511" y="464">حوض⁦ Swoole ⁩·⁦ Swow ⁩·⁦ Workerman⁩</text>
  <rect class="bx" x="666" y="424" width="178" height="52" rx="10"/>
  <text class="n ctr" x="755" y="447">NoPool</text>
  <text class="d ctr" x="755" y="464">النمط التقليدي⁦ FPM⁩</text>

  <line class="link" x1="450" y1="496" x2="450" y2="512" marker-end="url(#arw)"/>

  <!-- L5 طبقة النقل -->
  <rect class="band" x="40" y="516" width="820" height="88" rx="14" fill="#EDEEF8"/>
  <rect class="bar" x="56" y="542" width="5" height="36" rx="2.5" fill="#777BB4"/>
  <text class="lt" x="72" y="558">طبقة النقل</text>
  <text class="ls" x="72" y="576">Transport</text>
  <rect class="bx" x="216" y="534" width="150" height="52" rx="10"/>
  <text class="n ctr" x="291" y="565">TransportInterface</text>
  <rect class="bx" x="396" y="534" width="280" height="52" rx="10"/>
  <text class="n ctr" x="536" y="557">HttpTransport</text>
  <text class="d ctr" x="536" y="574">⁦Guzzle ⁩· ربط المعاملات ·⁦ FORMAT JSON⁩</text>
  <rect class="bx" x="706" y="534" width="138" height="52" rx="10"/>
  <text class="n ctr" x="775" y="557">TcpTransport</text>
  <text class="d ctr" x="775" y="574">لم يُنفَّذ بعد</text>

  <line class="link" x1="450" y1="606" x2="450" y2="622" marker-end="url(#arw)"/>

  <!-- L6 الطبقة الداعمة -->
  <rect class="band" x="40" y="626" width="820" height="88" rx="14" fill="#F2F3F5"/>
  <rect class="bar" x="56" y="652" width="5" height="36" rx="2.5" fill="#8A90A6"/>
  <text class="lt" x="72" y="668">الطبقة الداعمة</text>
  <text class="ls" x="72" y="686">Support</text>
  <rect class="bx" x="216" y="644" width="200" height="52" rx="10"/>
  <text class="n ctr" x="316" y="667">أدوات⁦ Support⁩</text>
  <text class="d ctr" x="316" y="684">Config · Quoter · Arr</text>
  <rect class="bx" x="446" y="644" width="200" height="52" rx="10"/>
  <text class="n ctr" x="546" y="667">Exceptions</text>
  <text class="d ctr" x="546" y="684">ClickHouse / Connection / Query</text>
  <rect class="bx" x="676" y="644" width="168" height="52" rx="10"/>
  <text class="n ctr" x="760" y="667">PSR-3 Logger</text>
  <text class="d ctr" x="760" y="684">سجل استعلامات اختياري</text>

  <line class="link" x1="450" y1="716" x2="450" y2="732" marker-end="url(#arw)"/>

  <!-- الخادم -->
  <rect x="40" y="736" width="820" height="88" rx="14" fill="#1E2233"/>
  <rect x="56" y="762" width="5" height="36" rx="2.5" fill="#FFD400"/>
  <text class="y" x="72" y="778">الخادم</text>
  <text class="y2" x="72" y="796">Server</text>
  <text class="w ctr" x="546" y="778">ClickHouse Server</text>
  <text class="w2 ctr" x="546" y="798">⁦HTTP :8123 ⁩مدعوم ｜⁦ Native TCP :9000 ⁩قيد التخطيط</text>

  <text class="sub ctr" x="450" y="856">الاعتماد باتجاه واحد: الطبقة العليا تعتمد على واجهة مجردة، والتنفيذ الأدنى قابل للاستبدال⁦ (Manager ⁩→⁦ ClientInterface ⁩→⁦ PoolInterface ⁩→⁦ TransportInterface)⁩</text>
</svg>
