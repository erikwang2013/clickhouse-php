<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">clickhouse-php تصميم البنية</title>
  <desc id="archDesc">بنية من ست طبقات: طبقة المدخل، وطبقة البناء، وطبقة العميل، وطبقة حوض الاتصالات، وطبقة النقل، والطبقة الداعمة، تستدعي خادم ClickHouse من الأعلى إلى الأسفل.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1E2233}
    .ttl{font-size:20px;font-weight:700}
    .sub{font-size:12px;fill:#5A6172}
    .lt{font-size:15px;font-weight:700}
    .ls{font-size:10.5px;fill:#5A6172}
    .n{font-size:12.5px;font-weight:600}
    .d{font-size:10.5px;fill:#5A6172}
    .ctr{text-anchor:middle}
    .y{font-size:15px;font-weight:700;fill:#FFD400}
    .y2{font-size:10.5px;fill:#8F97AE}
    .w{font-size:12.5px;font-weight:600;fill:#FFFFFF}
    .w2{font-size:10.5px;fill:#FFD400}
    .bar{stroke:none}
    .bx{fill:#fff;stroke:#1E2233;stroke-width:2}
    .band{stroke:#1E2233;stroke-width:2}
    .link{stroke:#1E2233;stroke-width:1.8;fill:none}
    .dash{stroke:#8A90A6;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#1E2233"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#8A90A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="880" fill="#FFFFFF"/>
  <text class="ttl ctr" x="450" y="44">⁦clickhouse-php ⁩تصميم البنية</text>
  <text class="sub" x="40" y="44">PHP &gt;= 8.0 · PSR-4 · Guzzle ^7.0</text>
  <text class="sub ctr" x="450" y="66">▼ من الأعلى إلى الأسفل يكون اتجاه الاستدعاء، وكل طبقة تعتمد على واجهة ما تحتها فقط</text>

  <!-- L1 طبقة المدخل -->
  <rect class="band" x="40" y="76" width="820" height="88" rx="14" fill="#FFF6D0"/>
  <rect class="bar" x="56" y="102" width="5" height="36" rx="2.5" fill="#FFD400"/>
  <text class="lt" x="72" y="118">طبقة المدخل</text>
  <text class="ls" x="72" y="136">واجهة / مدخل</text>
  <g>
    <rect class="bx" x="216" y="94" width="116" height="52" rx="10"/>
    <text class="n ctr" x="274" y="117">ClickHouse</text>
    <text class="d ctr" x="274" y="134">واجهة ساكنة</text>
    <rect class="bx" x="344" y="94" width="116" height="52" rx="10"/>
    <text class="n ctr" x="402" y="117">Laravel</text>
    <text class="d ctr" x="402" y="134">Provider+Facade</text>
    <rect class="bx" x="472" y="94" width="116" height="52" rx="10"/>
    <text class="n ctr" x="530" y="117">ThinkPHP</text>
    <text class="d ctr" x="530" y="134">Service+Facade</text>
    <rect class="bx" x="600" y="94" width="116" height="52" rx="10"/>
    <text class="n ctr" x="658" y="117">Webman</text>
    <text class="d ctr" x="658" y="134">Service+Install</text>
    <rect class="bx" x="728" y="94" width="116" height="52" rx="10"/>
    <text class="n ctr" x="786" y="117">Hyperf</text>
    <text class="d ctr" x="786" y="134">Provider+Pool</text>
  </g>

  <line class="link" x1="450" y1="166" x2="450" y2="182" marker-end="url(#arw)"/>

