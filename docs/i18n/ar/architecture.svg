  <rect class="band" x="40" y="186" width="820" height="88" rx="14" fill="#EDEEF8"/>
  <rect class="bar" x="56" y="212" width="5" height="36" rx="2.5" fill="#777BB4"/>
  <text class="lt" x="72" y="228">طبقة البناء</text>
  <text class="ls" x="72" y="246">Builder</text>
