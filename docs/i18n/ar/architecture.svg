    <text class="n ctr" x="450" y="227">Schema\Builder</text>
    <text class="d ctr" x="450" y="244">Blueprint · Column</text>
    <rect class="bx" x="536" y="204" width="148" height="52" rx="10"/>
    <text class="n ctr" x="610" y="227">ORM\Model</text>
    <text class="d ctr" x="610" y="244">Collection</text>
    <rect class="bx" x="696" y="204" width="148" height="52" rx="10"/>
    <text class="n ctr" x="770" y="227">Migration</text>
    <text class="d ctr" x="770" y="244">Migrator · Repository</text>
  </g>

  <line class="link" x1="450" y1="276" x2="450" y2="292" marker-end="url(#arw)"/>

  <!-- L3 طبقة العميل -->
  <rect class="band" x="40" y="296" width="820" height="88" rx="14" fill="#EDEEF8"/>
  <rect class="bar" x="56" y="322" width="5" height="36" rx="2.5" fill="#777BB4"/>
  <text class="lt" x="72" y="338">طبقة العميل</text>
  <text class="ls" x="72" y="356">Client</text>
  <rect class="bx" x="216" y="302" width="200" height="76" rx="10"/>
