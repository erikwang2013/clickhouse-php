<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" aria-labelledby="lifeTitle lifeDesc">
  <title id="lifeTitle">clickhouse-php دورة الحياة</title>
  <desc id="lifeDesc">دورة حياة الاستعلام في تسع خطوات: التهيئة، جلب العميل، البناء، الترجمة، أخذ اتصال من الحوض، الإرسال، التحليل، الاستهلاك، الإعادة؛ وعلى اليمين الاستثناءات المحتملة في كل مرحلة؛ وفي الأسفل دورة حياة المهاجرات.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1E2233}
    .ttl{font-size:20px;font-weight:700}
    .sub{font-size:12px;fill:#5A6172}
    .ctr{text-anchor:middle}
    .sec{font-size:14px;font-weight:700}
    .st{font-size:12.5px;font-weight:700}
    .sd{font-size:11px;fill:#5A6172}
    .num{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}
    .et{font-size:11.5px;font-weight:700}
    .ed{font-size:10.5px;fill:#5A6172}
    .ebx{fill:#FFF1F0;stroke:#E05252;stroke-width:1.8}
    .mt{font-size:12px;font-weight:700}
    .md{font-size:10px;fill:#5A6172}
    .bx{fill:#fff;stroke:#1E2233;stroke-width:2}
    .mbx{fill:#FFF6D0;stroke:#1E2233;stroke-width:2}
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#1E2233"/>
    </marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#E05252"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="860" fill="#FFFFFF"/>
  <text class="ttl ctr" x="450" y="44">⁦clickhouse-php ⁩دورة الحياة</text>
  <text class="sub ctr" x="450" y="66">على اليسار مسار الاستعلام الكامل، وعلى اليمين الاستثناءات المحتملة في كل مرحلة، وفي الأسفل دورة حياة المهاجرات</text>

  <text class="sec" x="40" y="102">① دورة حياة الاستعلام</text>
  <text class="sec" x="620" y="102">فروع الاستثناءات</text>

  <!-- المحور الرأسي -->
  <line x1="78" y1="140" x2="78" y2="588" stroke="#D5D8E3" stroke-width="3"/>
  <line x1="78" y1="140" x2="78" y2="588" stroke="#777BB4" stroke-width="3"/>

  <circle cx="78" cy="140" r="14" fill="#777BB4"/><text class="num" x="78" y="145">1</text>
  <text class="st" x="106" y="136">التهيئة</text>
  <text class="sd" x="106" y="154">⁦ClickHouse::setManager($manager)⁩، ويُربط محوّل الإطار كنسخة وحيدة في الحاوية</text>

  <circle cx="78" cy="196" r="14" fill="#777BB4"/><text class="num" x="78" y="201">2</text>
  <text class="st" x="106" y="192">جلب العميل</text>
  <text class="sd" x="106" y="210">⁦Manager::connection($name): ⁩يُرجع⁦ PooledClient ⁩من الحوض أو ينشئ⁦ HttpClient ⁩ويخزنه</text>

  <circle cx="78" cy="252" r="14" fill="#777BB4"/><text class="num" x="78" y="257">3</text>
  <text class="st" x="106" y="248">بناء الاستعلام</text>
  <text class="sd" x="106" y="266">⁦ClickHouse::table('logs')-&gt;where(...)-&gt;limit(100)⁩، وتتراكم الشروط في التسلسل</text>

  <circle cx="78" cy="308" r="14" fill="#777BB4"/><text class="num" x="78" y="313">4</text>
  <text class="st" x="106" y="304">ترجمة⁦ SQL⁩</text>
  <text class="sd" x="106" y="322">⁦Grammar::compileSelect() ⁩يُولّد⁦ SELECT ⁩…⁦ FROM `db`.`logs` WHERE ⁩…⁦ ORDER BY ⁩…⁦ LIMIT⁩</text>

  <circle cx="78" cy="364" r="14" fill="#777BB4"/><text class="num" x="78" y="369">5</text>
  <text class="st" x="106" y="360">أخذ اتصال من الحوض</text>
  <text class="sd" x="106" y="378">⁦PooledClient::withClient() ⁩→⁦ pool-&gt;get(): ⁩إعادة استخدام الخامل أو إنشاء دون الحد</text>

  <circle cx="78" cy="420" r="14" fill="#777BB4"/><text class="num" x="78" y="425">6</text>
  <text class="st" x="106" y="416">الربط والإرسال</text>
  <text class="sd" x="106" y="434">⁦HttpTransport::send(): ⁩استبدال العنصر النائب ?، وجسم⁦ POST ⁩هو⁦ SQL + FORMAT JSON⁩</text>

  <circle cx="78" cy="476" r="14" fill="#777BB4"/><text class="num" x="78" y="481">7</text>
  <text class="st" x="106" y="472">تحليل الاستجابة</text>
  <text class="sd" x="106" y="490">⁦HTTP 200 ⁩→⁦ json_decode ⁩→⁦ Result(rows, meta)⁩؛ وما عدا⁦ 200 ⁩→⁦ QueryException⁩</text>

  <circle cx="78" cy="532" r="14" fill="#777BB4"/><text class="num" x="78" y="537">8</text>
  <text class="st" x="106" y="528">استهلاك النتيجة</text>
  <text class="sd" x="106" y="546">⁦Result::first() ⁩·⁦ toArray() ⁩· تكرار الوصول، ومجموعة النتائج للقراءة فقط</text>

  <circle cx="78" cy="588" r="14" fill="#1E2233"/><text class="num" x="78" y="593">9</text>
  <text class="st" x="106" y="584">إعادة الاتصال</text>
  <text class="sd" x="106" y="602">⁦finally { pool-&gt;put($client) }: ⁩تُعاد في مساري النجاح والاستثناء</text>

  <!-- عمود الاستثناءات -->
  <rect class="ebx" x="620" y="168" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="188">الخطوة⁦ 2 ⁩· اتصال غير مُهيَّأ</text>
  <text class="ed" x="634" y="206">ConnectionException</text>

  <rect class="ebx" x="620" y="336" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="356">الخطوة⁦ 5 ⁩· نفاد الحوض</text>
  <text class="ed" x="634" y="374">PoolException (active ≥ max)</text>

  <rect class="ebx" x="620" y="392" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="412">الخطوة⁦ 6 ⁩· الشبكة غير متاحة</text>
  <text class="ed" x="634" y="430">ConnectionException / TimeoutException</text>

  <rect class="ebx" x="620" y="448" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="468">الخطوة⁦ 7 ⁩· خطأ في تنفيذ⁦ SQL⁩</text>
  <text class="ed" x="634" y="486">⁦QueryException (⁩يمكن أخذ⁦ getSql)⁩</text>

  <text class="sd" x="620" y="530">كل الاستثناءات ترث⁦ ClickHouseException⁩،</text>
  <text class="sd" x="620" y="548">ويمكن التقاط الصنف الفرعي لإعادة المحاولة.</text>
  <text class="sd" x="620" y="578">⁦ping() ⁩للفحص أولًا وتجنّب نقل عطل الاتصال</text>
  <text class="sd" x="620" y="596">إلى مسار استعلامات العمل.</text>

  <!-- دورة حياة المهاجرات -->
  <text class="sec" x="40" y="654">② دورة حياة المهاجرات</text>
  <line x1="40" y1="668" x2="860" y2="668" stroke="#E2E4EC" stroke-width="1.5"/>

  <rect class="mbx" x="40" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="110" y="714">install()</text>
  <text class="md ctr" x="110" y="733">إنشاء جدول⁦ migrations⁩</text>

  <rect class="mbx" x="210" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="280" y="714">run()</text>
  <text class="md ctr" x="280" y="733">تخطي المنفَّذ ·⁦ batch+1⁩</text>

  <rect class="mbx" x="380" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="450" y="714">up()</text>
  <text class="md ctr" x="450" y="733">تنفيذ المهاجرة والكتابة</text>

  <rect class="mbx" x="550" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="620" y="714">rollback()</text>
  <text class="md ctr" x="620" y="733">عكس الدفعة الأخيرة + حذف</text>

  <rect class="mbx" x="720" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="790" y="714">refresh()</text>
  <text class="md ctr" x="790" y="733">انتظار⁦ mutation ⁩ثم إعادة</text>

  <line x1="182" y1="721" x2="204" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="352" y1="721" x2="374" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="522" y1="721" x2="544" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="692" y1="721" x2="714" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>

  <text class="sd" x="40" y="782">عند الفشل يُرمى⁦ QueryException⁩، ويحمل الاستثناء⁦ batch ⁩وقائمة ما نُفِّذ هذه المرة.</text>
  <text class="sd" x="40" y="802">يعتمد تراجع⁦ refresh() ⁩على⁦ mutation ⁩غير المتزامن في⁦ ALTER TABLE ⁩…⁦ DELETE⁩، ولا بد من انتظاره قبل⁦ run() ⁩مجددًا.</text>
  <text class="sd" x="40" y="822">تُنفَّذ ملفات المهاجرات مرتبةً بالاسم، ويُشتق اسم الصنف من اسم الملف (بحذف بادئة الطابع الزمني وتحويله إلى⁦ camelCase).⁩</text>
</svg>
