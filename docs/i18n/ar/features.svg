<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="featTitle featDesc">
  <title id="featTitle">clickhouse-php تصميم الوظائف</title>
  <desc id="featDesc">ست وحدات وظيفية: منشئ الاستعلامات، وSchema Builder، ونظام المهاجرات، وORM، والاتصالات المتعددة وحوض الاتصالات، وتكامل الأطر، إضافة إلى الأمان ومنظومة الاستثناءات.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1E2233}
    .ttl{font-size:20px;font-weight:700}
    .sub{font-size:12px;fill:#5A6172}
    .ctr{text-anchor:middle}
    .card{fill:#fff;stroke:#1E2233;stroke-width:2}
    .ct{font-size:14px;font-weight:700}
    .cs{font-size:10px;fill:#8A90A6}
    .li{font-size:11.5px;fill:#333A4D}
    .hr{stroke:#E2E4EC;stroke-width:1.5}
    .bar{fill:#F2F3F5;stroke:#1E2233;stroke-width:2}
    .bt{font-size:13.5px;font-weight:700}
    .bl{font-size:11.5px;fill:#333A4D}
  </style>

  <rect x="0" y="0" width="900" height="780" fill="#FFFFFF"/>
  <text class="ttl ctr" x="450" y="44">⁦clickhouse-php ⁩تصميم الوظائف</text>
  <text class="sub ctr" x="450" y="66">ست وحدات وظيفية، وجميعها قدرات منفَّذة فعليًا</text>

  <!-- البطاقة 1: منشئ الاستعلامات -->
  <rect class="card" x="40" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="58" y="126">منشئ الاستعلامات</text>
  <text class="cs ctr" x="250" y="126">Query\Builder</text>
  <rect x="58" y="136" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="40" y1="150" x2="300" y2="150"/>
  <g>
    <circle cx="64" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="76" y="175">تسلسل الاستدعاءات، بناء فقط دون⁦ IO⁩</text>
    <circle cx="64" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="76" y="196">where / orWhere / whereIn / whereNotIn</text>
    <circle cx="64" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="76" y="217">whereBetween / whereNull / whereRaw</text>
    <circle cx="64" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="76" y="238">orderBy / groupBy / limit / offset</text>
    <circle cx="64" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="76" y="259">تجميع⁦ count / sum / avg / min / max⁩</text>
    <circle cx="64" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="76" y="280">⁦insert ⁩صف واحد أو دفعة (تجزئة⁦ 1000)⁩</text>
    <circle cx="64" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="76" y="301">⁦delete ⁩يُترجم إلى⁦ ALTER TABLE⁩</text>
    <circle cx="64" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="76" y="322">⁦toSql() ⁩يُخرج⁦ SQL ⁩المُترجم</text>
  </g>

  <!-- البطاقة 2: Schema Builder -->
  <rect class="card" x="320" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="338" y="126">Schema Builder</text>
  <text class="cs ctr" x="530" y="126">Schema\Builder</text>
  <rect x="338" y="136" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="320" y1="150" x2="580" y2="150"/>
  <g>
    <circle cx="344" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="356" y="175">⁦create / alter / drop ⁩إنشاء وتعديل</text>
    <circle cx="344" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="356" y="196">hasTable / getTables / getTableInfo</text>
    <circle cx="344" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="356" y="217">تغطي⁦ 21 ⁩نوع عمود في⁦ ClickHouse⁩</text>
    <circle cx="344" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="356" y="238">أرقام⁦ Int8-64 / UInt8-64 / Float32-64⁩</text>
    <circle cx="344" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="356" y="259">Decimal(P,S) · Date / DateTime64</text>
    <circle cx="344" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="356" y="280">معدِّلات⁦ Array / Nullable / LowCardinality⁩</text>
    <circle cx="344" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="356" y="301">أخرى⁦ UUID / Bool / FixedString(N)⁩</text>
    <circle cx="344" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="356" y="322">معاملات المحرك⁦ partitionBy / orderBy / ttl⁩</text>
  </g>

  <!-- البطاقة 3: نظام المهاجرات -->
  <rect class="card" x="600" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="618" y="126">نظام المهاجرات</text>
  <text class="cs ctr" x="810" y="126">Migration</text>
  <rect x="618" y="136" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="600" y1="150" x2="860" y2="150"/>
  <g>
    <circle cx="624" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="636" y="175">⁦install() ⁩ينشئ جدول⁦ migrations⁩</text>
    <circle cx="624" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="636" y="196">⁦run() ⁩يرتب ثم يستبعد المنفَّذة</text>
    <circle cx="624" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="636" y="217">لكل دفعة⁦ batch+1 ⁩ثم⁦ up() ⁩لكل سجل</text>
    <circle cx="624" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="636" y="238">⁦rollback(steps) ⁩تراجع الدفعة الأخيرة</text>
    <circle cx="624" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="636" y="259">⁦refresh() ⁩تراجع ثم⁦ mutation ⁩ثم إعادة</text>
    <circle cx="624" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="636" y="280">الفشل يرمي⁦ QueryException ⁩مع السياق</text>
    <circle cx="624" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="636" y="301">سجلات⁦ MergeTree ORDER BY migration⁩</text>
    <circle cx="624" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="636" y="322">صنف المهاجرة يستخدم⁦ Schema Builder⁩</text>
  </g>

  <!-- البطاقة 4: ORM -->
  <rect class="card" x="40" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="58" y="398">ORM</text>
  <text class="cs ctr" x="250" y="398">ORM\Model</text>
  <rect x="58" y="408" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="40" y1="422" x2="300" y2="422"/>
  <g>
    <circle cx="64" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="76" y="447">وراثة⁦ Model ⁩تكفي لـ⁦ ActiveRecord⁩</text>
    <circle cx="64" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="76" y="468">ساكنة⁦ where / find / all / insert⁩</text>
    <circle cx="64" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="76" y="489">⁦__callStatic ⁩يمرر دوال⁦ Builder⁩</text>
    <circle cx="64" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="76" y="510">⁦save() ⁩يكتب⁦ attributes ⁩الحالية</text>
    <circle cx="64" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="76" y="531">⁦__get / __set ⁩وصول دون تعريف الحقول</text>
    <circle cx="64" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="76" y="552">Collection map / filter / pluck</text>
    <circle cx="64" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="76" y="573">⁦first / last / count / ⁩وصول بالفهرس</text>
    <circle cx="64" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="76" y="594">قراءة فقط، والكتابة ترمي⁦ LogicException⁩</text>
  </g>

  <!-- البطاقة 5: الاتصالات والحوض -->
  <rect class="card" x="320" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="338" y="398">الاتصالات والحوض</text>
  <text class="cs ctr" x="530" y="398">Manager · Pool</text>
  <rect x="338" y="408" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="320" y1="422" x2="580" y2="422"/>
  <g>
    <circle cx="344" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="356" y="447">⁦Manager ⁩تبديل الاتصالات بالاسم</text>
    <circle cx="344" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="356" y="468">تحميل كسول + إعادة استخدام النسخ</text>
    <circle cx="344" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="356" y="489">حوض⁦ Swoole / Swow / Workerman⁩</text>
    <circle cx="344" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="356" y="510">⁦NoPool ⁩احتياطي للنمط التقليدي⁦ FPM⁩</text>
    <circle cx="344" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="356" y="531">⁦min / max_connections ⁩والمهلة</text>
    <circle cx="344" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="356" y="552">إعادة الاستخدام ثم الإنشاء ثم خطأ</text>
    <circle cx="344" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="356" y="573">⁦PooledClient ⁩يضمن الإعادة في⁦ finally⁩</text>
    <circle cx="344" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="356" y="594">⁦ping() ⁩فحص ·⁦ stats() ⁩حالة الحوض</text>
  </g>

  <!-- البطاقة 6: تكامل الأطر -->
  <rect class="card" x="600" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="618" y="398">تكامل الأطر</text>
  <text class="cs ctr" x="810" y="398">أربع محوّلات أطر</text>
  <rect x="618" y="408" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="600" y1="422" x2="860" y2="422"/>
  <g>
    <circle cx="624" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="636" y="447">⁦Laravel ⁩اكتشاف⁦ + Facade + ⁩أوامر</text>
    <circle cx="624" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="636" y="468">⁦ThinkPHP ⁩تسجيل⁦ Service + ⁩أوامر</text>
    <circle cx="624" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="636" y="489">⁦Webman ⁩تحميل إعداد الإضافة تلقائيًا</text>
    <circle cx="624" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="636" y="510">⁦Hyperf ConfigProvider + ⁩حوض⁦ Coroutine⁩</text>
    <circle cx="624" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="636" y="531">إعداد موحّد لـ⁦ connections / pool⁩</text>
    <circle cx="624" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="636" y="552">⁦CLICKHOUSE_* ⁩تتجاوز الافتراضي</text>
    <circle cx="624" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="636" y="573">سجل استعلامات اختياري⁦ PSR-3⁩</text>
    <circle cx="624" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="636" y="594">أدوات سطر الأوامر للجداول والمهاجرات</text>
  </g>

  <!-- الأمان والاستثناءات -->
  <rect class="bar" x="40" y="640" width="820" height="80" rx="14"/>
  <text class="bt" x="64" y="672">الأمان</text>
  <text class="bl" x="64" y="696">ربط المعاملات بعنصر نائب ? + تهريب⁦ Quoter⁩</text>
  <text class="bl" x="64" y="712">معرّفات القاعدة والجدول والعمود بين علامتي اقتباس خلفيتين</text>
  <line x1="470" y1="656" x2="470" y2="704" stroke="#C9CCD8" stroke-width="1.5"/>
  <text class="bt" x="500" y="672">منظومة الاستثناءات</text>
  <text class="bl" x="500" y="696">⁦ClickHouseException ⁩صنف أساسي، وله أربعة أصناف فرعية</text>
  <text class="bl" x="500" y="712">⁦Connection (⁩مع⁦ Timeout) ⁩·⁦ Query (getSql) ⁩·⁦ Pool⁩</text>

  <text class="sub ctr" x="450" y="754">جميع ما سبق قدرات منفَّذة؛ أما جملتا⁦ JOIN / HAVING ⁩وبروتوكول⁦ Native TCP ⁩فمخطط لهما لاحقًا</text>
</svg>
