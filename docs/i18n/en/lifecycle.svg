<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" aria-labelledby="lifeTitle lifeDesc">
  <title id="lifeTitle">clickhouse-php lifecycle</title>
  <desc id="lifeDesc">Nine-step query lifecycle: initialize, get client, build, compile, take pool connection, send, parse, consume, return; the right column lists exceptions each stage may throw; the bottom shows the migration lifecycle.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1E2233}
    .ttl{font-size:20px;font-weight:700}
    .sub{font-size:12px;fill:#5A6172}
    .ctr{text-anchor:middle}
    .sec{font-size:14px;font-weight:700}
    .st{font-size:12.5px;font-weight:700}
    .sd{font-size:11px;fill:#5A6172}
    .num{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}
    .et{font-size:11.5px;font-weight:700}
    .ed{font-size:10.5px;fill:#5A6172}
    .ebx{fill:#FFF1F0;stroke:#E05252;stroke-width:1.8}
    .mt{font-size:12px;font-weight:700}
    .md{font-size:10px;fill:#5A6172}
    .bx{fill:#fff;stroke:#1E2233;stroke-width:2}
    .mbx{fill:#FFF6D0;stroke:#1E2233;stroke-width:2}
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#1E2233"/>
    </marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#E05252"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="860" fill="#FFFFFF"/>
  <text class="ttl ctr" x="450" y="44">clickhouse-php lifecycle</text>
  <text class="sub ctr" x="450" y="66">Left: the full path of one query. Right: exceptions each stage may throw. Bottom: migration lifecycle</text>

  <text class="sec" x="40" y="102">① Query Lifecycle</text>
  <text class="sec" x="620" y="102">Error Branches</text>

  <!-- vertical spine -->
  <line x1="78" y1="140" x2="78" y2="588" stroke="#D5D8E3" stroke-width="3"/>
  <line x1="78" y1="140" x2="78" y2="588" stroke="#777BB4" stroke-width="3"/>

  <circle cx="78" cy="140" r="14" fill="#777BB4"/><text class="num" x="78" y="145">1</text>
  <text class="st" x="106" y="136">Initialize</text>
  <text class="sd" x="106" y="154">ClickHouse::setManager($manager); framework adapters bind it as a container singleton</text>

  <circle cx="78" cy="196" r="14" fill="#777BB4"/><text class="num" x="78" y="201">2</text>
  <text class="st" x="106" y="192">Get Client</text>
  <text class="sd" x="106" y="210">Manager::connection($name): PooledClient on a pool hit, else a new cached HttpClient</text>

  <circle cx="78" cy="252" r="14" fill="#777BB4"/><text class="num" x="78" y="257">3</text>
  <text class="st" x="106" y="248">Build Query</text>
  <text class="sd" x="106" y="266">ClickHouse::table('logs')-&gt;where(...)-&gt;limit(100); conditions accumulate in the chain</text>

  <circle cx="78" cy="308" r="14" fill="#777BB4"/><text class="num" x="78" y="313">4</text>
  <text class="st" x="106" y="304">Compile SQL</text>
  <text class="sd" x="106" y="322">Grammar::compileSelect() emits SELECT … FROM `db`.`logs` WHERE … ORDER BY … LIMIT</text>

  <circle cx="78" cy="364" r="14" fill="#777BB4"/><text class="num" x="78" y="369">5</text>
  <text class="st" x="106" y="360">Take Pool Connection</text>
  <text class="sd" x="106" y="378">PooledClient::withClient() → pool-&gt;get(): reuse idle / create below max</text>

  <circle cx="78" cy="420" r="14" fill="#777BB4"/><text class="num" x="78" y="425">6</text>
  <text class="st" x="106" y="416">Bind &amp; Send</text>
  <text class="sd" x="106" y="434">HttpTransport::send(): substitutes ? placeholders, POST body is SQL + FORMAT JSON</text>

  <circle cx="78" cy="476" r="14" fill="#777BB4"/><text class="num" x="78" y="481">7</text>
  <text class="st" x="106" y="472">Parse Response</text>
  <text class="sd" x="106" y="490">HTTP 200 → json_decode → Result(rows, meta); non-200 → QueryException</text>

  <circle cx="78" cy="532" r="14" fill="#777BB4"/><text class="num" x="78" y="537">8</text>
  <text class="st" x="106" y="528">Consume Result</text>
  <text class="sd" x="106" y="546">Result::first() · toArray() · iteration; the result set is read-only</text>

  <circle cx="78" cy="588" r="14" fill="#1E2233"/><text class="num" x="78" y="593">9</text>
  <text class="st" x="106" y="584">Return Connection</text>
  <text class="sd" x="106" y="602">finally { pool-&gt;put($client) }: released on both the success and error paths</text>

  <!-- error column -->
  <rect class="ebx" x="620" y="168" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="188">Step 2 · no connection configured</text>
  <text class="ed" x="634" y="206">ConnectionException</text>

  <rect class="ebx" x="620" y="336" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="356">Step 5 · pool exhausted</text>
  <text class="ed" x="634" y="374">PoolException (active ≥ max)</text>

  <rect class="ebx" x="620" y="392" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="412">Step 6 · network unreachable</text>
  <text class="ed" x="634" y="430">ConnectionException / TimeoutException</text>

  <rect class="ebx" x="620" y="448" width="240" height="50" rx="10"/>
  <text class="et" x="634" y="468">Step 7 · SQL execution failed</text>
  <text class="ed" x="634" y="486">QueryException (getSql available)</text>

  <text class="sd" x="620" y="530">All exceptions extend ClickHouseException,</text>
  <text class="sd" x="620" y="548">so specific subclasses can be caught for</text>
  <text class="sd" x="620" y="578">retry or fallback. ping() can probe first,</text>
  <text class="sd" x="620" y="596">keeping faults off the query path.</text>

  <!-- migration lifecycle -->
  <text class="sec" x="40" y="654">② Migration Lifecycle</text>
  <line x1="40" y1="668" x2="860" y2="668" stroke="#E2E4EC" stroke-width="1.5"/>

  <rect class="mbx" x="40" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="110" y="714">install()</text>
  <text class="md ctr" x="110" y="733">creates migrations table</text>

  <rect class="mbx" x="210" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="280" y="714">run()</text>
  <text class="md ctr" x="280" y="733">skip applied · batch+1</text>

  <rect class="mbx" x="380" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="450" y="714">up()</text>
  <text class="md ctr" x="450" y="733">run migration, record it</text>

  <rect class="mbx" x="550" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="620" y="714">rollback()</text>
  <text class="md ctr" x="620" y="733">reverse down() + delete</text>

  <rect class="mbx" x="720" y="690" width="140" height="62" rx="10"/>
  <text class="mt ctr" x="790" y="714">refresh()</text>
  <text class="md ctr" x="790" y="733">wait mutation, then rerun</text>

  <line x1="182" y1="721" x2="204" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="352" y1="721" x2="374" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="522" y1="721" x2="544" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="692" y1="721" x2="714" y2="721" stroke="#1E2233" stroke-width="1.8" marker-end="url(#arw)"/>

  <text class="sd" x="40" y="782">On failure it throws QueryException carrying the batch and the list executed so far.</text>
  <text class="sd" x="40" y="802">refresh() rollback relies on the async ALTER TABLE … DELETE mutation, which must finish before run() again.</text>
  <text class="sd" x="40" y="822">Migration files run in filename order; class names come from filenames (strip the timestamp prefix, camel-case).</text>
</svg>
