<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="featTitle featDesc">
  <title id="featTitle">clickhouse-php feature design</title>
  <desc id="featDesc">Six feature modules: query builder, Schema Builder, migrations, ORM, multi-connection and pooling, framework integration, plus security and the exception hierarchy.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1E2233}
    .ttl{font-size:20px;font-weight:700}
    .sub{font-size:12px;fill:#5A6172}
    .ctr{text-anchor:middle}
    .card{fill:#fff;stroke:#1E2233;stroke-width:2}
    .ct{font-size:14px;font-weight:700}
    .cs{font-size:10px;fill:#8A90A6}
    .li{font-size:11.5px;fill:#333A4D}
    .hr{stroke:#E2E4EC;stroke-width:1.5}
    .bar{fill:#F2F3F5;stroke:#1E2233;stroke-width:2}
    .bt{font-size:13.5px;font-weight:700}
    .bl{font-size:11.5px;fill:#333A4D}
  </style>

  <rect x="0" y="0" width="900" height="780" fill="#FFFFFF"/>
  <text class="ttl ctr" x="450" y="44">clickhouse-php feature design</text>
  <text class="sub ctr" x="450" y="66">Six feature modules, all already implemented</text>

  <!-- Card 1: Query Builder -->
  <rect class="card" x="40" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="58" y="126">Query Builder</text>
  <text class="cs ctr" x="250" y="126">Query\Builder</text>
  <rect x="58" y="136" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="40" y1="150" x2="300" y2="150"/>
  <g>
    <circle cx="64" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="76" y="175">Fluent chaining, builds without IO</text>
    <circle cx="64" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="76" y="196">where / orWhere / whereIn / whereNotIn</text>
    <circle cx="64" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="76" y="217">whereBetween / whereNull / whereRaw</text>
    <circle cx="64" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="76" y="238">orderBy / groupBy / limit / offset</text>
    <circle cx="64" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="76" y="259">Aggregates count / sum / avg / min / max</text>
    <circle cx="64" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="76" y="280">insert single &amp; batch (1000/chunk)</text>
    <circle cx="64" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="76" y="301">delete → ALTER TABLE … DELETE</text>
    <circle cx="64" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="76" y="322">toSql() returns the compiled SQL</text>
  </g>

  <!-- Card 2: Schema Builder -->
  <rect class="card" x="320" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="338" y="126">Schema Builder</text>
  <text class="cs ctr" x="530" y="126">Schema\Builder</text>
  <rect x="338" y="136" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="320" y1="150" x2="580" y2="150"/>
  <g>
    <circle cx="344" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="356" y="175">create / alter / drop table DDL</text>
    <circle cx="344" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="356" y="196">hasTable / getTables / getTableInfo</text>
    <circle cx="344" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="356" y="217">Covers 21 ClickHouse column types</text>
    <circle cx="344" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="356" y="238">Numeric Int8-64 / UInt8-64 / Float32-64</text>
    <circle cx="344" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="356" y="259">Decimal(P,S) · Date / DateTime64</text>
    <circle cx="344" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="356" y="280">Modifiers Array / Nullable / LowCardinality</text>
    <circle cx="344" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="356" y="301">Others UUID / Bool / FixedString(N)</text>
    <circle cx="344" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="356" y="322">Engine params partitionBy / orderBy / ttl</text>
  </g>

  <!-- Card 3: Migrations -->
  <rect class="card" x="600" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="618" y="126">Migrations</text>
  <text class="cs ctr" x="810" y="126">Migration</text>
  <rect x="618" y="136" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="600" y1="150" x2="860" y2="150"/>
  <g>
    <circle cx="624" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="636" y="175">install() creates the migrations table</text>
    <circle cx="624" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="636" y="196">run() sorts, skips applied migrations</text>
    <circle cx="624" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="636" y="217">batch+1 per run, records after up()</text>
    <circle cx="624" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="636" y="238">rollback(steps) rolls back last batch</text>
    <circle cx="624" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="636" y="259">refresh() rollback → wait → rerun</text>
    <circle cx="624" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="636" y="280">failures throw QueryException w/ context</text>
    <circle cx="624" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="636" y="301">MergeTree ORDER BY migration table</text>
    <circle cx="624" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="636" y="322">migration classes use Schema Builder</text>
  </g>

  <!-- Card 4: ORM -->
  <rect class="card" x="40" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="58" y="398">ORM</text>
  <text class="cs ctr" x="250" y="398">ORM\Model</text>
  <rect x="58" y="408" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="40" y1="422" x2="300" y2="422"/>
  <g>
    <circle cx="64" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="76" y="447">extending Model gives ActiveRecord</text>
    <circle cx="64" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="76" y="468">static entry where / find / all / insert</text>
    <circle cx="64" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="76" y="489">__callStatic forwards to the Builder</text>
    <circle cx="64" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="76" y="510">save() writes back current attributes</text>
    <circle cx="64" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="76" y="531">__get / __set access undeclared fields</text>
    <circle cx="64" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="76" y="552">Collection map / filter / pluck</text>
    <circle cx="64" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="76" y="573">first / last / count / index access</text>
    <circle cx="64" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="76" y="594">read-only: writes throw LogicException</text>
  </g>

  <!-- Card 5: multi-connection & pool -->
  <rect class="card" x="320" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="338" y="398">Multi-connection &amp; Pool</text>
  <text class="cs ctr" x="530" y="398">Manager · Pool</text>
  <rect x="338" y="408" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="320" y1="422" x2="580" y2="422"/>
  <g>
    <circle cx="344" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="356" y="447">Manager switches connections by name</text>
    <circle cx="344" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="356" y="468">lazy connect + cached instance reuse</text>
    <circle cx="344" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="356" y="489">Swoole / Swow / Workerman pools</text>
    <circle cx="344" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="356" y="510">NoPool fallback for classic FPM</text>
    <circle cx="344" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="356" y="531">min / max_connections + timeouts</text>
    <circle cx="344" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="356" y="552">reuse idle → create below max → error</text>
    <circle cx="344" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="356" y="573">PooledClient finally releases client</text>
    <circle cx="344" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="356" y="594">ping() health check · stats() pool stats</text>
  </g>

  <!-- Card 6: framework integration -->
  <rect class="card" x="600" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="618" y="398">Framework Integration</text>
  <text class="cs ctr" x="810" y="398">Four adapters</text>
  <rect x="618" y="408" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="600" y1="422" x2="860" y2="422"/>
  <g>
    <circle cx="624" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="636" y="447">Laravel auto-discovery + Facade + CLI</text>
    <circle cx="624" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="636" y="468">ThinkPHP Service registration + think</text>
    <circle cx="624" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="636" y="489">Webman plugin config auto-loading</text>
    <circle cx="624" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="636" y="510">Hyperf ConfigProvider + coroutine pool</text>
    <circle cx="624" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="636" y="531">shared connections / pool config</text>
    <circle cx="624" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="636" y="552">CLICKHOUSE_* env vars override defaults</text>
    <circle cx="624" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="636" y="573">optional PSR-3 query logging</text>
    <circle cx="624" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="636" y="594">table list / migration CLI commands</text>
  </g>

  <!-- Security and exceptions -->
  <rect class="bar" x="40" y="640" width="820" height="80" rx="14"/>
  <text class="bt" x="64" y="672">Security</text>
  <text class="bl" x="64" y="696">? placeholder binding + Quoter escaping</text>
  <text class="bl" x="64" y="712">backtick quoting for db / table / column</text>
  <line x1="470" y1="656" x2="470" y2="704" stroke="#C9CCD8" stroke-width="1.5"/>
  <text class="bt" x="500" y="672">Exceptions</text>
  <text class="bl" x="500" y="696">ClickHouseException is the base, four subclasses</text>
  <text class="bl" x="500" y="712">Connection (incl. Timeout) · Query (getSql) · Pool</text>

  <text class="sub ctr" x="450" y="754">All of the above are implemented; JOIN / HAVING and the Native TCP protocol are planned</text>
</svg>
