<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="featTitle featDesc">
  <title id="featTitle">clickhouse-php 기능 설계</title>
  <desc id="featDesc">6대 기능 모듈: 쿼리 빌더, Schema Builder, 마이그레이션 시스템, ORM, 다중 연결과 커넥션 풀, 프레임워크 통합, 그리고 보안과 예외 체계.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1E2233}
    .ttl{font-size:20px;font-weight:700}
    .sub{font-size:12px;fill:#5A6172}
    .ctr{text-anchor:middle}
    .card{fill:#fff;stroke:#1E2233;stroke-width:2}
    .ct{font-size:14px;font-weight:700}
    .cs{font-size:10px;fill:#8A90A6}
    .li{font-size:11.5px;fill:#333A4D}
    .hr{stroke:#E2E4EC;stroke-width:1.5}
    .bar{fill:#F2F3F5;stroke:#1E2233;stroke-width:2}
    .bt{font-size:13.5px;font-weight:700}
    .bl{font-size:11.5px;fill:#333A4D}
  </style>

  <rect x="0" y="0" width="900" height="780" fill="#FFFFFF"/>
  <text class="ttl ctr" x="450" y="44">clickhouse-php 기능 설계</text>
  <text class="sub ctr" x="450" y="66">6대 기능 모듈, 모두 현재 구현된 기능입니다</text>

  <!-- 카드 1: 쿼리 빌더 -->
  <rect class="card" x="40" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="58" y="126">쿼리 빌더</text>
  <text class="cs ctr" x="250" y="126">Query\Builder</text>
  <rect x="58" y="136" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="40" y1="150" x2="300" y2="150"/>
  <g>
    <circle cx="64" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="76" y="175">체이닝 호출, IO 없는 순수 빌드</text>
    <circle cx="64" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="76" y="196">where / orWhere / whereIn / whereNotIn</text>
    <circle cx="64" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="76" y="217">whereBetween / whereNull / whereRaw</text>
    <circle cx="64" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="76" y="238">orderBy / groupBy / limit / offset</text>
    <circle cx="64" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="76" y="259">집계 count / sum / avg / min / max</text>
    <circle cx="64" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="76" y="280">insert 단일 행 / 배치 (1000행씩 분할)</text>
    <circle cx="64" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="76" y="301">delete → ALTER TABLE … DELETE</text>
    <circle cx="64" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="76" y="322">toSql() 은 컴파일된 SQL 출력</text>
  </g>

  <!-- 카드 2: Schema Builder -->
  <rect class="card" x="320" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="338" y="126">Schema Builder</text>
  <text class="cs ctr" x="530" y="126">Schema\Builder</text>
  <rect x="338" y="136" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="320" y1="150" x2="580" y2="150"/>
  <g>
    <circle cx="344" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="356" y="175">create / alter / drop 테이블 조작</text>
    <circle cx="344" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="356" y="196">hasTable / getTables / getTableInfo</text>
    <circle cx="344" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="356" y="217">ClickHouse 컬럼 타입 21종 지원</text>
    <circle cx="344" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="356" y="238">수치 Int8-64 / UInt8-64 / Float32-64</text>
    <circle cx="344" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="356" y="259">Decimal(P,S) · Date / DateTime64</text>
    <circle cx="344" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="356" y="280">수식어 Array / Nullable / LowCardinality</text>
    <circle cx="344" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="356" y="301">기타 UUID / Bool / FixedString(N)</text>
    <circle cx="344" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="356" y="322">엔진 파라미터 partitionBy / orderBy / ttl</text>
  </g>

  <!-- 카드 3: 마이그레이션 시스템 -->
  <rect class="card" x="600" y="96" width="260" height="252" rx="14"/>
  <text class="ct" x="618" y="126">마이그레이션 시스템</text>
  <text class="cs ctr" x="810" y="126">Migration</text>
  <rect x="618" y="136" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="600" y1="150" x2="860" y2="150"/>
  <g>
    <circle cx="624" cy="171" r="2.5" fill="#777BB4"/><text class="li" x="636" y="175">install() 로 migrations 기록 테이블 생성</text>
    <circle cx="624" cy="192" r="2.5" fill="#777BB4"/><text class="li" x="636" y="196">run() 은 정렬 후 실행분 필터링</text>
    <circle cx="624" cy="213" r="2.5" fill="#777BB4"/><text class="li" x="636" y="217">배치마다 batch+1, up() 후 기록 저장</text>
    <circle cx="624" cy="234" r="2.5" fill="#777BB4"/><text class="li" x="636" y="238">rollback(steps) 마지막 배치 역순 롤백</text>
    <circle cx="624" cy="255" r="2.5" fill="#777BB4"/><text class="li" x="636" y="259">refresh() 롤백 → mutation 대기 → 재실행</text>
    <circle cx="624" cy="276" r="2.5" fill="#777BB4"/><text class="li" x="636" y="280">실패 시 QueryException 에 컨텍스트 포함</text>
    <circle cx="624" cy="297" r="2.5" fill="#777BB4"/><text class="li" x="636" y="301">기록 테이블 MergeTree ORDER BY migration</text>
    <circle cx="624" cy="318" r="2.5" fill="#777BB4"/><text class="li" x="636" y="322">마이그레이션에서 Schema Builder 사용</text>
  </g>

  <!-- 카드 4: ORM -->
  <rect class="card" x="40" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="58" y="398">ORM</text>
  <text class="cs ctr" x="250" y="398">ORM\Model</text>
  <rect x="58" y="408" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="40" y1="422" x2="300" y2="422"/>
  <g>
    <circle cx="64" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="76" y="447">Model 상속만으로 ActiveRecord</text>
    <circle cx="64" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="76" y="468">정적 진입점 where / find / all / insert</text>
    <circle cx="64" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="76" y="489">__callStatic 로 Builder 메서드 위임</text>
    <circle cx="64" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="76" y="510">save() 는 현재 attributes 를 기록</text>
    <circle cx="64" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="76" y="531">__get / __set 선언 없는 필드 접근</text>
    <circle cx="64" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="76" y="552">Collection map / filter / pluck</text>
    <circle cx="64" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="76" y="573">first / last / count / 인덱스 접근</text>
    <circle cx="64" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="76" y="594">읽기 전용 컬렉션, 쓰기 시 LogicException</text>
  </g>

  <!-- 카드 5: 다중 연결과 커넥션 풀 -->
  <rect class="card" x="320" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="338" y="398">다중 연결과 커넥션 풀</text>
  <text class="cs ctr" x="530" y="398">Manager · Pool</text>
  <rect x="338" y="408" width="48" height="4" rx="2" fill="#FFD400"/>
  <line class="hr" x1="320" y1="422" x2="580" y2="422"/>
  <g>
    <circle cx="344" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="356" y="447">Manager 로 다중 연결 이름별 전환</text>
    <circle cx="344" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="356" y="468">지연 로딩 + 인스턴스 캐시 재사용</text>
    <circle cx="344" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="356" y="489">Swoole / Swow / Workerman 코루틴 풀</text>
    <circle cx="344" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="356" y="510">NoPool 은 FPM 전통 모드의 폴백</text>
    <circle cx="344" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="356" y="531">min / max_connections 와 타임아웃</text>
    <circle cx="344" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="356" y="552">유휴 재사용 → 부족 시 생성 → 초과 오류</text>
    <circle cx="344" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="356" y="573">PooledClient 는 finally 로 반환 보장</text>
    <circle cx="344" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="356" y="594">ping() 헬스 체크 · stats() 풀 상태 확인</text>
  </g>

  <!-- 카드 6: 프레임워크 통합 -->
  <rect class="card" x="600" y="368" width="260" height="252" rx="14"/>
  <text class="ct" x="618" y="398">프레임워크 통합</text>
  <text class="cs ctr" x="810" y="398">네 가지 어댑터</text>
  <rect x="618" y="408" width="48" height="4" rx="2" fill="#777BB4"/>
  <line class="hr" x1="600" y1="422" x2="860" y2="422"/>
  <g>
    <circle cx="624" cy="443" r="2.5" fill="#777BB4"/><text class="li" x="636" y="447">Laravel 자동 검색 + Facade + 명령</text>
    <circle cx="624" cy="464" r="2.5" fill="#777BB4"/><text class="li" x="636" y="468">ThinkPHP Service 등록 + think 명령</text>
    <circle cx="624" cy="485" r="2.5" fill="#777BB4"/><text class="li" x="636" y="489">Webman 플러그인 설정 자동 로드</text>
    <circle cx="624" cy="506" r="2.5" fill="#777BB4"/><text class="li" x="636" y="510">Hyperf ConfigProvider + 코루틴 풀</text>
    <circle cx="624" cy="527" r="2.5" fill="#777BB4"/><text class="li" x="636" y="531">통합 설정 connections / pool</text>
    <circle cx="624" cy="548" r="2.5" fill="#777BB4"/><text class="li" x="636" y="552">환경 변수 CLICKHOUSE_* 우선 적용</text>
    <circle cx="624" cy="569" r="2.5" fill="#777BB4"/><text class="li" x="636" y="573">선택적 PSR-3 쿼리 로그</text>
    <circle cx="624" cy="590" r="2.5" fill="#777BB4"/><text class="li" x="636" y="594">테이블 목록 / 마이그레이션 CLI 도구</text>
  </g>

  <!-- 보안과 예외 -->
  <rect class="bar" x="40" y="640" width="820" height="80" rx="14"/>
  <text class="bt" x="64" y="672">보안</text>
  <text class="bl" x="64" y="696">? 플레이스홀더 파라미터 바인딩 + Quoter 이스케이프</text>
  <text class="bl" x="64" y="712">DB / 테이블 / 컬럼 식별자 백틱 인용</text>
  <line x1="470" y1="656" x2="470" y2="704" stroke="#C9CCD8" stroke-width="1.5"/>
  <text class="bt" x="500" y="672">예외 체계</text>
  <text class="bl" x="500" y="696">ClickHouseException 이 기반 클래스, 하위 예외 4종</text>
  <text class="bl" x="500" y="712">Connection(Timeout 포함) · Query(getSql) · Pool</text>

  <text class="sub ctr" x="450" y="754">위 항목은 모두 구현된 기능이며, JOIN / HAVING 절과 Native TCP 프로토콜은 향후 계획입니다</text>
</svg>
